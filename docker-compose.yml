services:
  bot:
    build: .
    container_name: avito-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/app/data/data.db
    ports:
      # 1C API + Swagger UI
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    volumes:
      - bot-data:/app/data

volumes:
  bot-data:
